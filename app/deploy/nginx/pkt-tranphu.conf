# =============================================================================
# Nginx config cho Phòng Kinh Tế Xã Trần Phú - reverse proxy tới Next.js
# =============================================================================
# Vị trí: /etc/nginx/sites-available/pkt-tranphu.conf
# Symlink: ln -s /etc/nginx/sites-available/pkt-tranphu.conf /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx
#
# Tính năng:
#   - TLS 1.3 only (TLS 1.2 fallback nếu cần)
#   - HSTS preload-ready
#   - OCSP stapling
#   - Geo-block: chỉ cho phép VN (cần GeoIP2 module)
#   - Rate limit cho /api/auth
#   - Upgrade HTTP → HTTPS
# =============================================================================

# Rate limit zones (KHAI BÁO Ở /etc/nginx/nginx.conf trong http {} block):
# limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# Geo-block: cần module ngx_http_geoip2 + DB GeoLite2
# load_module modules/ngx_http_geoip2_module.so;
# geoip2 /var/lib/GeoIP/GeoLite2-Country.mmdb {
#     auto_reload 60m;
#     $geoip2_country_code default=UN country iso_code;
# }
# map $geoip2_country_code $allowed_country {
#     default no;
#     VN yes;
# }

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name pkt-tranphu.vn www.pkt-tranphu.vn;

    # Cho Let's Encrypt cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pkt-tranphu.vn;

    # ──────────────────────────────────────────────
    # TLS configuration
    # ──────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/pkt-tranphu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkt-tranphu.vn/privkey.pem;

    # TLS 1.3 only + TLS 1.2 fallback (Mozilla Modern config)
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/pkt-tranphu.vn/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ──────────────────────────────────────────────
    # Security headers (bổ sung CSP từ Next.js)
    # ──────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ──────────────────────────────────────────────
    # Geo-block: chỉ cho phép truy cập từ VN (uncomment khi đã setup GeoIP2)
    # ──────────────────────────────────────────────
    # if ($allowed_country = no) {
    #     return 444; # close connection without response
    # }

    # ──────────────────────────────────────────────
    # Body size + timeout
    # ──────────────────────────────────────────────
    client_max_body_size 50M;       # legal pdf upload có thể 50MB
    client_body_timeout 60s;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;
    keepalive_timeout 30s;

    # ──────────────────────────────────────────────
    # Rate limit cho /api/auth (chống brute-force)
    # ──────────────────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit /api chung
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ──────────────────────────────────────────────
    # Reverse proxy → Next.js (port 3000)
    # ──────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Static asset caching
        proxy_intercept_errors on;
    }

    # Static files Next.js (cache mạnh)
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Robots.txt + favicon + manifest
    location ~ ^/(robots\.txt|favicon\.ico|manifest\.json)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }

    # Log
    access_log /var/log/nginx/pkt-tranphu.access.log;
    error_log /var/log/nginx/pkt-tranphu.error.log warn;
}

# --- Default deny: drop traffic không khớp server_name ---
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}
